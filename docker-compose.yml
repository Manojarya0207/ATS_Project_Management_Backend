services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ats_pm
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d ats_pm"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ats:ats_password@db:5432/ats_pm
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
    volumes:
      - uploads:/code/uploads
    ports:
      - "8000:8000"

volumes:
  pgdata:
  uploads:
