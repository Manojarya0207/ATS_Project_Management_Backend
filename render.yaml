services:
  - type: web
    name: ats-project-management-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ats-pm-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: CORS_ORIGINS
        value: "*" # Customize this to your frontend URL in production (e.g. https://your-frontend-domain.com)
      - key: CORS_ALLOW_LOCAL_DEV
        value: "true"
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: uploads

databases:
  - name: ats-pm-db
    plan: free
