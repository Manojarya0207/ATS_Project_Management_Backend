[project]
name = "ats-project-management-backend"
version = "2.0.0"
description = "Enterprise project management API — FastAPI, async SQLAlchemy, PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
    "uuid-utils>=0.9",
    "anyio>=4.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "psycopg[binary]>=3.2",
]
s3 = ["boto3>=1.35"]
redis = ["redis>=5.2"]
celery = ["celery>=5.4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # function call in argument defaults — FastAPI Depends() idiom
    "SIM108", # ternary preference — readability call
    "UP042",  # (str, Enum) kept over StrEnum — explicit str values are the API contract
    "N818",   # AppException naming — established hierarchy name
    "UP046",  # Generic[T] base kept — pydantic/mypy compatibility
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"scripts/verify_e2e.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/", "scripts/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
